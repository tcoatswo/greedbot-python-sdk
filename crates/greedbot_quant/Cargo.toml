[package]
name = "greedbot_quant"
version = "0.1.0"
edition = "2021"

[lib]
name = "greedbot_quant"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "greedbot_quant"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
statrs = "0.17"
libc = "0.2"
